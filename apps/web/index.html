<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ORIGAMI3で折り紙の展開図を作り、折り方を確かめられます。"
    />
    <title>ORIGAMI3</title>
  </head>

  <body class="web-app">
    <aside class="web-guide" aria-label="ダウンロードのご案内">
      <p class="web-guide__text">ORIGAMI3 ブラウザ版</p>
      <div class="web-guide__actions">
        <button
          class="web-guide__button"
          id="manual-download"
          type="button"
          aria-haspopup="dialog"
          aria-controls="manual-confirmation"
        >
          取扱説明書をダウンロード
        </button>
        <a
          class="web-guide__button web-guide__button--primary"
          href="https://github.com/oltotlo79-rgb/ORIGAMI3/releases/latest"
          target="_blank"
          rel="noopener noreferrer"
        >
          速い版（Windows）
        </a>
      </div>
    </aside>

    <div id="root"></div>

    <dialog
      class="manual-confirmation"
      id="manual-confirmation"
      aria-labelledby="manual-confirmation-message"
    >
      <p id="manual-confirmation-message">
        取扱説明書（PDF、約28 MB）をダウンロードしますか？
      </p>
      <div class="manual-confirmation__actions">
        <a
          class="web-guide__button web-guide__button--primary"
          id="manual-confirm-yes"
          href="https://github.com/oltotlo79-rgb/ORIGAMI3/releases/latest/download/ORIGAMI3.pdf"
          target="_blank"
          rel="noopener noreferrer"
        >
          はい
        </a>
        <button
          class="web-guide__button"
          id="manual-confirm-no"
          type="button"
        >
          いいえ
        </button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
