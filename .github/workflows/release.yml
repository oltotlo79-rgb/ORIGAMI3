name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "再ビルドするリリースタグ（例: v0.1.0）"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release-windows:
    name: Build and release Windows packages
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Validate release version
        id: meta
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:REQUESTED_TAG
          } else {
            $tag = $env:GITHUB_REF_NAME
          }

          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$') {
            throw "リリースタグの形式が不正です: $tag"
          }

          $version = $Matches.version
          $tauriConfig = Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $package = Get-Content -LiteralPath "apps/desktop/package.json" -Raw | ConvertFrom-Json
          $packageLockText = Get-Content -LiteralPath "apps/desktop/package-lock.json" -Raw
          $cargoToml = Get-Content -LiteralPath "Cargo.toml" -Raw

          # Windows PowerShell 5.1でも同じ5か所を読めるよう、手元の
          # Get-PackageLockVersions と同じく packages[""] のキーだけ一時置換する。
          $emptyKeyPattern = [regex]'(?m)^(?<indent>[ \t]*)""[ \t]*:'
          if ($emptyKeyPattern.Matches($packageLockText).Count -ne 1) {
            throw 'package-lock.json の packages[""] を1つに特定できません。'
          }
          $normalizedPackageLock = $emptyKeyPattern.Replace(
            $packageLockText,
            '${indent}"__release_check_workspace__":',
            1
          )
          $packageLock = $normalizedPackageLock | ConvertFrom-Json
          $packageLockRootProperty = $packageLock.PSObject.Properties["version"]
          $packageLockPackagesProperty = $packageLock.PSObject.Properties["packages"]
          if ($null -eq $packageLockRootProperty -or $null -eq $packageLockPackagesProperty) {
            throw "package-lock.json のルート version または packages を取得できません。"
          }
          $packageLockWorkspaceProperty = $packageLockPackagesProperty.Value.PSObject.Properties["__release_check_workspace__"]
          if ($null -eq $packageLockWorkspaceProperty) {
            throw 'package-lock.json の packages[""] を取得できません。'
          }
          $packageLockWorkspaceVersionProperty = $packageLockWorkspaceProperty.Value.PSObject.Properties["version"]
          if ($null -eq $packageLockWorkspaceVersionProperty) {
            throw 'package-lock.json の packages[""].version を取得できません。'
          }
          $workspacePackage = [regex]::Match(
            $cargoToml,
            '(?ms)^\[workspace\.package\]\s*(?<body>.*?)(?=^\[|\z)'
          )
          $cargoVersionMatch = [regex]::Match(
            $workspacePackage.Groups['body'].Value,
            '(?m)^version\s*=\s*"(?<version>[^"]+)"'
          )
          if (-not $workspacePackage.Success -or -not $cargoVersionMatch.Success) {
            throw "Cargo.toml から workspace.package.version を取得できません。"
          }
          $packageLockRootVersion = [string]$packageLockRootProperty.Value
          $packageLockWorkspaceVersion = [string]$packageLockWorkspaceVersionProperty.Value
          $cargoVersion = $cargoVersionMatch.Groups['version'].Value

          if ([string]$tauriConfig.version -ne $version) {
            throw "タグ $tag と tauri.conf.json の version $($tauriConfig.version) が一致しません。"
          }
          if ([string]$package.version -ne $version) {
            throw "タグ $tag と package.json の version $($package.version) が一致しません。"
          }
          if ($packageLockRootVersion -ne $version) {
            throw "タグ $tag と package-lock.json ルートの version $packageLockRootVersion が一致しません。"
          }
          if ($packageLockWorkspaceVersion -ne $version) {
            throw ('タグ {0} と package-lock.json packages[""].version {1} が一致しません。' -f $tag, $packageLockWorkspaceVersion)
          }
          if ($cargoVersion -ne $version) {
            throw "タグ $tag と Cargo.toml の version $cargoVersion が一致しません。"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Split('+')[0].Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Run pre-publication release readiness gate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts\check-release-ready.ps1 `
            -Tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            throw "公開前関門の6段が合格しませんでした。組み立てと公開を中止します。"
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (resolved 2026-08-29)

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build user manual PDF
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-manual.ps1

      - name: Build Tauri application
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Collect release files
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"

          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "target/release"
          $bundleRoot = Join-Path $releaseRoot "bundle"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"

          $nsisPattern = "ORIGAMI3_{0}_*-setup.exe" -f $env:VERSION
          $msiPattern = "ORIGAMI3_{0}_*.msi" -f $env:VERSION
          $nsisFiles = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot "nsis") -Filter $nsisPattern -File)
          $msiFiles = @(Get-ChildItem -LiteralPath (Join-Path $bundleRoot "msi") -Filter $msiPattern -File)
          $portable = Join-Path $releaseRoot "desktop.exe"

          if ($nsisFiles.Count -ne 1) {
            throw "NSISインストーラーが1件ではありません: $($nsisFiles.Count)"
          }
          if ($msiFiles.Count -ne 1) {
            throw "MSIインストーラーが1件ではありません: $($msiFiles.Count)"
          }
          if (-not (Test-Path -LiteralPath $portable -PathType Leaf)) {
            throw "ポータブル版exeが見つかりません: $portable"
          }

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          # 配布名は半角英数字・ピリオド・ハイフン・アンダースコアだけにする。
          # GitHubはリリースに添付したファイル名のうち、それ以外の文字を "." へ置き換え、
          # 連続した "." を1つに畳む。実測: docs/manual/ORIGAMI3取扱説明書.pdf を添付すると、
          # v0.4.2 / v0.4.4 / v0.4.5 のいずれでも ORIGAMI3.pdf という名前で公開されている。
          # そのため日本語の配布名は付けられない。例えば
          #   ORIGAMI3_{版}_インストーラー_Windows用.exe と
          #   ORIGAMI3_{版}_ポータブル_Windows用.exe は
          # どちらも ORIGAMI3_{版}_._Windows.exe になり、互いに衝突する。
          # 初心者向けの案内は、日本語がそのまま残るリリース説明文(下のbody)で行う。
          $setupName = "ORIGAMI3_{0}_setup.exe" -f $env:VERSION
          $msiName = "ORIGAMI3_{0}_x64.msi" -f $env:VERSION
          $portableName = "ORIGAMI3_{0}_portable.exe" -f $env:VERSION

          Copy-Item -LiteralPath $nsisFiles[0].FullName -Destination (Join-Path $outputDir $setupName)
          Copy-Item -LiteralPath $msiFiles[0].FullName -Destination (Join-Path $outputDir $msiName)
          Copy-Item -LiteralPath $portable -Destination (Join-Path $outputDir $portableName)

          # 公開後に名前が変わらないことを、添付する前に確かめる。
          foreach ($name in @($setupName, $msiName, $portableName)) {
            if ($name -notmatch '^[A-Za-z0-9._-]+$') {
              throw "配布ファイル名に、GitHubが置き換える文字が含まれています: $name"
            }
            $copied = Join-Path $outputDir $name
            if (-not (Test-Path -LiteralPath $copied -PathType Leaf)) {
              throw "配布ファイルを作れませんでした: $copied"
            }
          }

          Get-ChildItem -LiteralPath $outputDir -File | Select-Object Name, Length

      - name: Prepare component lists and verify release artifacts locally
        id: publication_files
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          $version = $env:VERSION
          $buildId = [string]$env:GITHUB_RUN_ID
          $setupName = "ORIGAMI3_{0}_setup.exe" -f $version
          $msiName = "ORIGAMI3_{0}_x64.msi" -f $version
          $portableName = "ORIGAMI3_{0}_portable.exe" -f $version
          $manualSource = Join-Path $env:GITHUB_WORKSPACE "docs\manual\ORIGAMI3取扱説明書.pdf"
          $manualPath = Join-Path $outputDir "ORIGAMI3.pdf"
          $publishedNames = @($setupName, $msiName, $portableName, "ORIGAMI3.pdf")
          $statusName = "ORIGAMI3_{0}_component-list-status.json" -f $version
          $statusPath = Join-Path $outputDir $statusName
          $manifestPath = Join-Path $outputDir ("ORIGAMI3_{0}_SHA256SUMS.txt" -f $version)
          $recordPath = Join-Path $outputDir ("ORIGAMI3_{0}_artifact-record.json" -f $version)
          $localResultPath = Join-Path $outputDir ("ORIGAMI3_{0}_prepublication-verification-result.json" -f $version)

          if (-not (Test-Path -LiteralPath $manualSource -PathType Leaf)) {
            throw "説明書PDFが見つかりません: $manualSource"
          }
          Copy-Item -LiteralPath $manualSource -Destination $manualPath -Force

          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts\supply-chain-generate-release-hashes.ps1 `
            -Version $version `
            -BuildId $buildId `
            -SetupPath (Join-Path $outputDir $setupName) `
            -MsiPath (Join-Path $outputDir $msiName) `
            -PortablePath (Join-Path $outputDir $portableName) `
            -ManualPath $manualPath `
            -DestinationDirectory $outputDir
          if ($LASTEXITCODE -ne 0) { throw "Hash record generator exited with $LASTEXITCODE." }

          foreach ($artifactName in $publishedNames) {
            $inventoryPath = Join-Path $outputDir ("{0}.components.cdx.json" -f $artifactName)
            & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File scripts\supply-chain-generate-sbom.ps1 `
              -DestinationPath $inventoryPath `
              -ArtifactName $artifactName `
              -BuildId $buildId
            if ($LASTEXITCODE -ne 0) { throw "Component list generator failed for $artifactName with $LASTEXITCODE." }
            if (-not (Test-Path -LiteralPath $inventoryPath -PathType Leaf)) {
              throw "Component list generator did not create $inventoryPath."
            }
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts\supply-chain-verify-release-hashes.ps1 `
            -ManifestPath $manifestPath `
            -DownloadedDirectory $outputDir `
            -RecordPath $recordPath `
            -ResultPath $localResultPath
          if ($LASTEXITCODE -ne 0) {
            throw "公開前の配布物4件が、作成したハッシュ記録と一致しませんでした。"
          }

          $recordsState = "complete"
          $summaryMessage = "配布物4件のhash・部品一覧を作成し、公開前のローカル照合に合格しました。"

          $status = [ordered]@{
            schema = 1
            version = $version
            buildId = $buildId
            state = $recordsState
            message = $summaryMessage
            componentListCount = 4
            hashSidecarCount = 4
            localVerification = [IO.Path]::GetFileName($localResultPath)
          }
          [IO.File]::WriteAllText(
            $statusPath,
            ($status | ConvertTo-Json -Depth 5) + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

          $releaseFiles = @(
            "release-artifacts/$setupName",
            "release-artifacts/$msiName",
            "release-artifacts/$portableName",
            "release-artifacts/ORIGAMI3.pdf",
            "release-artifacts/$statusName",
            "release-artifacts/ORIGAMI3_${version}_prepublication-verification-result.json",
            "release-artifacts/ORIGAMI3_${version}_release-receipt.json"
          )
          foreach ($artifactName in $publishedNames) {
            $releaseFiles += "release-artifacts/$artifactName.components.cdx.json"
            $releaseFiles += "release-artifacts/$artifactName.sha256"
          }
          $releaseFiles += "release-artifacts/ORIGAMI3_${version}_SHA256SUMS.txt"
          $releaseFiles += "release-artifacts/ORIGAMI3_${version}_artifact-record.json"

          $delimiter = "ORI3_RELEASE_FILES_" + [guid]::NewGuid().ToString("N")
          "files<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $releaseFiles | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "component_records_state=$recordsState" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## 配布物に添える確認記録"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- 状態: $recordsState"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- $summaryMessage"

      - name: Verify same-SHA checks and create release receipt
        id: release_receipt
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          RECORDS_STATE: ${{ steps.publication_files.outputs.component_records_state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RECORDS_STATE -ne "complete") {
            throw "公開前のhash・部品一覧・ローカル照合が揃っていません。"
          }
          if ([string]$env:GITHUB_RUN_ID -notmatch '^\d+$' -or [string]$env:GITHUB_RUN_ATTEMPT -notmatch '^\d+$' -or [string]$env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "release runのid・attempt・SHAを取得できません。"
          }

          $headSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -notmatch '^[0-9a-f]{40}$') {
            throw "checkoutしたHEADのSHAを取得できません。"
          }
          $tagSha = (& git rev-list -n 1 $env:TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagSha -notmatch '^[0-9a-f]{40}$') {
            throw "タグ $env:TAG のSHAを取得できません。"
          }
          if ($headSha -cne $env:GITHUB_SHA -or $tagSha -cne $env:GITHUB_SHA) {
            throw "タグ・checkout HEAD・GitHub runのSHAが一致しません: tag=$tagSha HEAD=$headSha run=$env:GITHUB_SHA"
          }

          $runsJson = @(& gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&per_page=100")
          if ($LASTEXITCODE -ne 0) { throw "同じSHAのci.yml実行を取得できませんでした。" }
          $runs = ($runsJson -join "`n") | ConvertFrom-Json
          # ci.ymlのchecks jobが実行対象となるpush/PRだけを候補にし、同じSHAの最新runを選ぶ。
          # schedule/workflow_dispatchではchecksがskipされるため、成功証拠として扱わない。
          $ciRun = @($runs.workflow_runs | Where-Object {
            [string]$_.head_sha -ceq $env:GITHUB_SHA -and [string]$_.event -in @("push", "pull_request")
          } | Sort-Object -Property id -Descending | Select-Object -First 1)
          if ($ciRun.Count -ne 1) {
            throw "同じSHAのci.yml実行を1件に特定できません。"
          }
          if ([string]$ciRun[0].status -cne "completed" -or [string]$ciRun[0].conclusion -cne "success") {
            throw "同じSHAの最新ci.yml実行がsuccessではありません: id=$($ciRun[0].id) status=$($ciRun[0].status) conclusion=$($ciRun[0].conclusion)"
          }

          $jobsJson = @(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($ciRun[0].id)/jobs?per_page=100")
          if ($LASTEXITCODE -ne 0) { throw "同じSHAのci.yml実行からchecks jobを取得できませんでした。" }
          $jobs = ($jobsJson -join "`n") | ConvertFrom-Json
          $checksJob = @($jobs.jobs | Where-Object { [string]$_.name -ceq "Tests, lint, and desktop checks" })
          if ($checksJob.Count -ne 1 -or [string]$checksJob[0].conclusion -cne "success") {
            throw "同じSHAのchecks jobがsuccessではありません。"
          }
          if ([string]$ciRun[0].id -notmatch '^\d+$' -or [string]$ciRun[0].run_attempt -notmatch '^\d+$' -or [string]$checksJob[0].id -notmatch '^\d+$') {
            throw "CI runまたはchecks jobのid・attemptを証拠として取得できません。"
          }

          $outputDir = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          $recordPath = Join-Path $outputDir ("ORIGAMI3_{0}_artifact-record.json" -f $env:VERSION)
          $artifactRecord = Get-Content -LiteralPath $recordPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$artifactRecord.schema -ne 1 -or [string]$artifactRecord.version -cne $env:VERSION -or [string]$artifactRecord.buildId -cne [string]$env:GITHUB_RUN_ID) {
            throw "hash記録がこの版・このrelease runで作成された証拠になっていません。"
          }
          $artifactHashes = @($artifactRecord.artifacts | ForEach-Object {
            [ordered]@{ name = [string]$_.artifactName; sha256 = [string]$_.sha256 }
          })
          if ($artifactHashes.Count -ne 4 -or @($artifactHashes.name | Sort-Object -Unique).Count -ne 4) {
            throw "receiptへ記録する配布物hashが4件ではありません。"
          }
          $componentListHashes = @($artifactHashes.name | Sort-Object | ForEach-Object {
            $name = "{0}.components.cdx.json" -f $_
            $path = Join-Path $outputDir $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "receiptへ記録する部品一覧がありません: $name"
            }
            [ordered]@{ name = $name; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() }
          })

          $tauriVersion = [string](Get-Content -LiteralPath "apps/desktop/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $packageVersion = [string](Get-Content -LiteralPath "apps/desktop/package.json" -Raw | ConvertFrom-Json).version
          $packageLockText = Get-Content -LiteralPath "apps/desktop/package-lock.json" -Raw
          $emptyKeyPattern = [regex]'(?m)^(?<indent>[ \t]*)""[ \t]*:'
          if ($emptyKeyPattern.Matches($packageLockText).Count -ne 1) { throw 'packages[""] を1つに特定できません。' }
          $normalizedPackageLock = $emptyKeyPattern.Replace($packageLockText, '${indent}"__release_check_workspace__":', 1)
          $packageLock = $normalizedPackageLock | ConvertFrom-Json
          $packageLockRootVersion = [string]$packageLock.PSObject.Properties["version"].Value
          $packageLockWorkspaceVersion = [string]$packageLock.PSObject.Properties["packages"].Value.PSObject.Properties["__release_check_workspace__"].Value.PSObject.Properties["version"].Value
          $cargoToml = Get-Content -LiteralPath "Cargo.toml" -Raw
          $workspacePackage = [regex]::Match($cargoToml, '(?ms)^\[workspace\.package\]\s*(?<body>.*?)(?=^\[|\z)')
          $cargoVersionMatch = [regex]::Match($workspacePackage.Groups['body'].Value, '(?m)^version\s*=\s*"(?<version>[^"]+)"')
          if (-not $workspacePackage.Success -or -not $cargoVersionMatch.Success) { throw "Cargo.tomlの版を取得できません。" }
          $cargoVersion = $cargoVersionMatch.Groups['version'].Value
          $versionValues = @($tauriVersion, $packageVersion, $packageLockRootVersion, $packageLockWorkspaceVersion, $cargoVersion)
          if ($versionValues.Count -ne 5 -or @($versionValues | Sort-Object -Unique).Count -ne 1 -or $versionValues[0] -cne $env:VERSION) {
            throw "receiptへ記録する版5値が一致しません。"
          }

          $manualHash = @($artifactHashes | Where-Object { $_.name -ceq "ORIGAMI3.pdf" })
          if ($manualHash.Count -ne 1) { throw "説明書PDFのhashを1件に特定できません。" }
          $manifestPath = Join-Path $outputDir ("ORIGAMI3_{0}_SHA256SUMS.txt" -f $env:VERSION)
          $localResultPath = Join-Path $outputDir ("ORIGAMI3_{0}_prepublication-verification-result.json" -f $env:VERSION)
          $evidencePaths = @($manifestPath, $recordPath, $localResultPath)
          $evidenceFiles = @($evidencePaths | ForEach-Object {
            if (-not (Test-Path -LiteralPath $_ -PathType Leaf)) { throw "公開前の証拠ファイルがありません: $_" }
            [ordered]@{ name = [IO.Path]::GetFileName($_); sha256 = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          if ($evidenceFiles.Count -ne 3) { throw "receiptへ記録する公開前証拠が3件ではありません。" }
          $receipt = [ordered]@{
            schemaVersion = 1
            tag = $env:TAG
            version = $env:VERSION
            githubRunId = [string]$env:GITHUB_RUN_ID
            githubRunAttempt = [string]$env:GITHUB_RUN_ATTEMPT
            githubSha = $env:GITHUB_SHA
            ciRun = [ordered]@{
              workflow = "ci.yml"
              runId = [string]$ciRun[0].id
              runAttempt = [string]$ciRun[0].run_attempt
              sha = [string]$ciRun[0].head_sha
              conclusion = [string]$ciRun[0].conclusion
              event = [string]$ciRun[0].event
              url = [string]$ciRun[0].html_url
              checksJobId = [string]$checksJob[0].id
              checksJobName = [string]$checksJob[0].name
              checksConclusion = [string]$checksJob[0].conclusion
            }
            versions = [ordered]@{
              tauriConfig = $tauriVersion
              package = $packageVersion
              packageLockRoot = $packageLockRootVersion
              packageLockWorkspace = $packageLockWorkspaceVersion
              cargoWorkspace = $cargoVersion
            }
            artifacts = $artifactHashes
            componentLists = $componentListHashes
            manual = [ordered]@{ name = "ORIGAMI3.pdf"; sha256 = $manualHash[0].sha256 }
            evidenceFiles = $evidenceFiles
            signing = [ordered]@{
              signed = $false
              reason = "利用者の決定により署名なしで配布する。"
              references = @("docs/progress.md:60", "docs/progress.md:63")
            }
          }
          $receiptPath = Join-Path $outputDir ("ORIGAMI3_{0}_release-receipt.json" -f $env:VERSION)
          [IO.File]::WriteAllText($receiptPath, ($receipt | ConvertTo-Json -Depth 8) + "`n", [Text.UTF8Encoding]::new($false))
          $writtenReceipt = Get-Content -LiteralPath $receiptPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$writtenReceipt.githubSha -cne $env:GITHUB_SHA -or [string]$writtenReceipt.ciRun.sha -cne $env:GITHUB_SHA -or [string]$writtenReceipt.ciRun.conclusion -cne "success" -or -not ($writtenReceipt.signing.signed -eq $false)) {
            throw "release receiptの再読込検査に失敗しました。"
          }
          "receipt_state=complete" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- release receipt: $([IO.Path]::GetFileName($receiptPath)) (same-SHA CI run $($ciRun[0].id), checks success)"

      - name: Publish GitHub Release
        if: ${{ steps.publication_files.outputs.component_records_state == 'complete' && steps.release_receipt.outputs.receipt_state == 'complete' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ORIGAMI3 ${{ steps.meta.outputs.tag }}
          # generate_release_notes と body は併用できる。bodyは自動生成の文の前に置かれる。
          # 根拠: softprops/action-gh-release の action.yml、generate_release_notes の説明
          # 「If body is specified, the body will be pre-pended to the automatically generated notes.」
          generate_release_notes: true
          # ファイル名はGitHubが半角英数字へ直してしまうため、日本語の案内はここに書く。
          # 表に載せる名前は、公開後に実際に表示される名前と必ず同じにする。
          # 取扱説明書PDFは ORIGAMI3取扱説明書.pdf として添付しても、
          # GitHub上では ORIGAMI3.pdf として公開される(v0.4.2/v0.4.4/v0.4.5で実測)。
          body: |
            ## どれをダウンロードすればよいですか

            このページの下のほうにある「**Assets**」に、ファイルが並んでいます。
            ファイル名は英語ですが、下の表のとおりに選べば大丈夫です。
            **はじめての方は、表のいちばん上のものを選んでください。**

            | あなたの場合 | ダウンロードするもの |
            | --- | --- |
            | ふつうにWindowsで使いたい（**おすすめ**） | `ORIGAMI3_${{ steps.meta.outputs.version }}_setup.exe` |
            | インストールせずに持ち運びたい | `ORIGAMI3_${{ steps.meta.outputs.version }}_portable.exe` |
            | 会社などで多数の端末へまとめて入れたい | `ORIGAMI3_${{ steps.meta.outputs.version }}_x64.msi` |
            | 使い方を読みたい | `ORIGAMI3.pdf`（取扱説明書です） |
            | 配布物の中身と照合情報を確認したい | `ORIGAMI3_${{ steps.meta.outputs.version }}_component-list-status.json` |
            | 中身のプログラムを見たい | `Source code (zip)` または `Source code (tar.gz)` |

            ### ダウンロードしたあとは

            - **`ORIGAMI3_${{ steps.meta.outputs.version }}_setup.exe`（おすすめ）**
              ダブルクリックして、画面の案内どおりに進めてください。パソコンに入ります。
              次からはスタートメニューから開けます。ふつうはこれを選べば大丈夫です。
            - **`ORIGAMI3_${{ steps.meta.outputs.version }}_portable.exe`**
              パソコンに入れる必要はありません。このファイル1つをダブルクリックすると、そのまま開きます。
              USBメモリなどに入れて持ち歩けます。
            - **`ORIGAMI3_${{ steps.meta.outputs.version }}_x64.msi`**
              会社や学校で、多くのパソコンへまとめて配る担当の方向けです。
              自分の1台で使うだけなら、これは必要ありません。

            ### Windowsの警告が出たとき

            これらの配布物には署名を付けていません。署名を追加する予定はありません。Windows SmartScreenの警告が表示される場合があります。

            1. このページの配布物であることと、上の表のファイル名と一致することを確認します。
            2. 警告画面で「詳細情報」を選び、表示されたアプリ名とダウンロードしたファイルを確認します。
            3. 確認できた場合だけ「実行」を選びます。ダウンロード元やファイル名が違う場合は実行せず、削除してください。

            Windows Smart App Controlが有効な環境では、「実行」を選べずに起動が完全に止まる場合があります。その場合は設定を下げず、端末の管理者へ相談してください。

            ※ `Source code` の2つはGitHubが自動で付けるもので、名前を変えられません。
            ※ いまのところWindows用だけです。

            ---
          prerelease: ${{ steps.meta.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: ${{ steps.publication_files.outputs.files }}

      # 「公開されたものが正しい」ことを確かめるのが目的なので、直前のbuildで作った
      # release-artifacts/ のローカルファイルは使い回さず、公開先(GitHub Releases)から
      # 改めて取得する。ハッシュ/SBOM記録が作れていなければ何とも照合できないため、
      # component_records_state=complete でなければここで明確に失敗させる。
      - name: Download published release artifacts for verification
        id: verify_download
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          RECORDS_STATE: ${{ steps.publication_files.outputs.component_records_state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:RECORDS_STATE -ne "complete") {
            throw "配布物の中身の一覧と照合用ファイルが作成されなかったため(component_records_state=$($env:RECORDS_STATE))、公開後の照合を実行できません。記録が無いまま「公開後に照合した」とは扱いません。"
          }

          $downloadDir = Join-Path $env:GITHUB_WORKSPACE "release-verify-download"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null

          $setupName = "ORIGAMI3_{0}_setup.exe" -f $env:VERSION
          $msiName = "ORIGAMI3_{0}_x64.msi" -f $env:VERSION
          $portableName = "ORIGAMI3_{0}_portable.exe" -f $env:VERSION
          $manifestName = "ORIGAMI3_{0}_SHA256SUMS.txt" -f $env:VERSION
          $recordName = "ORIGAMI3_{0}_artifact-record.json" -f $env:VERSION

          foreach ($assetName in @($setupName, $msiName, $portableName, "ORIGAMI3.pdf", $manifestName, $recordName)) {
            & gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $downloadDir --pattern $assetName --clobber
            if ($LASTEXITCODE -ne 0) { throw "公開済み配布物を取得し直せませんでした: $assetName" }
            $downloadedPath = Join-Path $downloadDir $assetName
            if (-not (Test-Path -LiteralPath $downloadedPath -PathType Leaf)) {
              throw "取得し直した配布物が見つかりません: $downloadedPath"
            }
          }

          "download_dir=$downloadDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_path=$(Join-Path $downloadDir $manifestName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "record_path=$(Join-Path $downloadDir $recordName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify downloaded release artifacts against the published hash records
        id: verify_hashes
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          DOWNLOAD_DIR: ${{ steps.verify_download.outputs.download_dir }}
          MANIFEST_PATH: ${{ steps.verify_download.outputs.manifest_path }}
          RECORD_PATH: ${{ steps.verify_download.outputs.record_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultPath = Join-Path $env:DOWNLOAD_DIR ("ORIGAMI3_{0}_release-verification-result.json" -f $env:VERSION)

          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File scripts\supply-chain-verify-release-hashes.ps1 `
            -ManifestPath $env:MANIFEST_PATH `
            -DownloadedDirectory $env:DOWNLOAD_DIR `
            -RecordPath $env:RECORD_PATH `
            -ResultPath $resultPath
          if ($LASTEXITCODE -ne 0) {
            throw "公開済みの配布物が、公開したハッシュ記録と一致しませんでした。タグ $env:TAG のリリースを確認してください。"
          }

          "result_path=$resultPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## 公開後の配布物照合"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- タグ $env:TAG で公開された4件の配布物を、公開先(GitHub Releases)から取得し直し、公開したハッシュ記録と一致することを確認しました。"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
          Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'

      - name: Publish the verification result as a release asset
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          RESULT_PATH: ${{ steps.verify_hashes.outputs.result_path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          & gh release upload $env:TAG $env:RESULT_PATH --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "公開後の照合結果をリリースへ添付できませんでした。" }
          Write-Host "Uploaded verification result: $env:RESULT_PATH"
