name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Sunday 03:17 UTC. This is separate from the existing daily CI schedule.
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cargo_and_licenses:
    name: Cargo advisories and dependency licenses
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      CARGO_AUDIT_VERSION: "0.22.2"
      CARGO_AUDIT_CRATE_SHA256: 700c2b240f7fd330c24b675fe429f73a5b676531fcc6300400b2b67f155ba12a

    steps:
      - name: Set the build directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_RUN_ID -notmatch "^\d+$" -or $env:GITHUB_RUN_ATTEMPT -notmatch "^\d+$") {
            throw "GitHub run identity is unavailable; run-scoped Cargo paths cannot be created."
          }
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\ori3-target-security" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_HOME=$env:RUNNER_TEMP\ori3-cargo-home-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # A floating checkout action is not used. The exact event revision is fetched and verified.
      - name: Check out the exact event revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          $credentials = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $credentials" `
            -c protocol.version=2 fetch --no-tags --prune --depth=1 origin `
            "+$env:GITHUB_REF`:refs/remotes/origin/security-event"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          $actualRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualRevision -ne $env:GITHUB_SHA) {
            throw "Checked-out revision '$actualRevision' does not match GITHUB_SHA '$env:GITHUB_SHA'."
          }

      - name: Install and verify the pinned cargo-audit
        id: cargo_audit_pin_evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $policy = Get-Content -LiteralPath ".github/security-policy.json" -Raw -Encoding UTF8 |
            ConvertFrom-Json
          if ([string]$policy.toolPins.cargoAudit.version -ne $env:CARGO_AUDIT_VERSION) {
            throw "Workflow cargo-audit version differs from security-policy.json."
          }
          if ([string]$policy.toolPins.cargoAudit.crateSha256 -ne $env:CARGO_AUDIT_CRATE_SHA256) {
            throw "Workflow cargo-audit checksum differs from security-policy.json."
          }
          if ($env:GITHUB_RUN_ID -notmatch "^\d+$" -or
              $env:GITHUB_RUN_ATTEMPT -notmatch "^\d+$" -or
              $env:GITHUB_SHA -notmatch "^[0-9a-f]{40}$") {
            throw "GitHub run identity is unavailable; cargo-audit receipt cannot be bound to this run."
          }
          $receiptPath = Join-Path $env:RUNNER_TEMP `
            "cargo-audit-pin-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          $runnerArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- cargo-audit runner OS architecture: $runnerArchitecture"
          if ($runnerArchitecture -ne "X64") {
            throw "cargo-audit is installed only on an X64 GitHub runner; this runner reported '$runnerArchitecture'."
          }
          $registryUri = "https://index.crates.io/ca/rg/cargo-audit"
          $registryResponse = Invoke-WebRequest -Uri $registryUri -UseBasicParsing
          if ([int]$registryResponse.StatusCode -ne 200) {
            throw "cargo-audit registry evidence request returned HTTP $($registryResponse.StatusCode)."
          }
          $registryMatches = New-Object System.Collections.Generic.List[object]
          foreach ($line in @($registryResponse.Content -split "`r?`n")) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            try {
              $candidate = $line | ConvertFrom-Json
            }
            catch {
              throw "cargo-audit registry evidence contains invalid JSON: $($_.Exception.Message)"
            }
            if ([string]$candidate.name -eq "cargo-audit" -and
                [string]$candidate.vers -eq $env:CARGO_AUDIT_VERSION) {
              $registryMatches.Add($candidate)
            }
          }
          if ($registryMatches.Count -ne 1) {
            throw "cargo-audit registry evidence must contain exactly one record for $env:CARGO_AUDIT_VERSION."
          }
          $registryRecord = $registryMatches[0]
          if ([string]$registryRecord.cksum -cne $env:CARGO_AUDIT_CRATE_SHA256 -or
              -not ($registryRecord.yanked -is [bool]) -or
              $registryRecord.yanked -ne $false) {
            throw "cargo-audit registry checksum or yanked status differs from the exact pin."
          }
          $archiveDownloadUri = "https://static.crates.io/crates/cargo-audit/cargo-audit-$env:CARGO_AUDIT_VERSION.crate"
          $sourceBundleRoot = Join-Path $env:RUNNER_TEMP `
            "cargo-audit-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $archivePath = Join-Path $sourceBundleRoot "cargo-audit-$env:CARGO_AUDIT_VERSION.crate"
          $extractRoot = Join-Path $sourceBundleRoot "extracted"
          New-Item -ItemType Directory -Force -Path $sourceBundleRoot | Out-Null
          Invoke-WebRequest -Uri $archiveDownloadUri -UseBasicParsing -OutFile $archivePath
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw "The pinned cargo-audit crate archive was not downloaded from $archiveDownloadUri."
          }
          $downloadedArchiveSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($downloadedArchiveSha256 -cne $env:CARGO_AUDIT_CRATE_SHA256) {
            throw "The cargo-audit archive downloaded from static.crates.io differs from the policy checksum."
          }
          $tarCommand = Get-Command tar.exe -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if ($null -eq $tarCommand) {
            throw "tar.exe is required to inspect the verified cargo-audit crate archive."
          }
          $archiveEntries = @(& $tarCommand.Source -tf $archivePath 2>&1)
          if ($LASTEXITCODE -ne 0 -or $archiveEntries.Count -eq 0) {
            throw "The verified cargo-audit crate archive could not be listed: $($archiveEntries -join ' ')"
          }
          $expectedArchivePrefix = "cargo-audit-$env:CARGO_AUDIT_VERSION/"
          $unsafeArchiveEntries = @(
            $archiveEntries | Where-Object {
              $entry = ([string]$_).Replace("\", "/")
              [string]::IsNullOrWhiteSpace($entry) -or
                -not $entry.StartsWith($expectedArchivePrefix, [StringComparison]::Ordinal) -or
                $entry -match '(^|/)\.\.(?:/|$)' -or
                $entry -match '^[A-Za-z]:'
            }
          )
          if ($unsafeArchiveEntries.Count -ne 0 -or
              @($archiveEntries | Where-Object { [string]$_ -ceq "${expectedArchivePrefix}Cargo.toml" }).Count -ne 1 -or
              @($archiveEntries | Where-Object { [string]$_ -ceq "${expectedArchivePrefix}Cargo.lock" }).Count -ne 1) {
            throw "The verified cargo-audit crate archive has an unsafe or incomplete file layout."
          }
          New-Item -ItemType Directory -Force -Path $extractRoot | Out-Null
          & $tarCommand.Source -xf $archivePath -C $extractRoot
          if ($LASTEXITCODE -ne 0) { throw "The verified cargo-audit crate archive could not be extracted." }
          $sourceRoot = Join-Path $extractRoot "cargo-audit-$env:CARGO_AUDIT_VERSION"
          if (-not (Test-Path -LiteralPath (Join-Path $sourceRoot "Cargo.toml") -PathType Leaf) -or
              -not (Test-Path -LiteralPath (Join-Path $sourceRoot "Cargo.lock") -PathType Leaf)) {
            throw "The extracted cargo-audit source is missing Cargo.toml or Cargo.lock."
          }
          $cargoAuditInstallRoot = Join-Path $env:RUNNER_TEMP `
            "cargo-audit-install-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          cargo install --path $sourceRoot --locked `
            --root $cargoAuditInstallRoot --force
          if ($LASTEXITCODE -ne 0) { throw "cargo-audit locked installation failed after checksum verification" }
          $expectedVersionOutput = "cargo-audit $env:CARGO_AUDIT_VERSION"
          $cargoAuditExe = Join-Path $cargoAuditInstallRoot "bin\cargo-audit.exe"
          if (-not (Test-Path -LiteralPath $cargoAuditExe -PathType Leaf)) {
            throw "The installed cargo-audit executable was not found at $cargoAuditExe."
          }
          $directReportedVersion = @(& $cargoAuditExe --version 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $directReportedVersion.Trim() -cne $expectedVersionOutput) {
            throw "The installed cargo-audit executable reported an unexpected version: $directReportedVersion"
          }
          $archiveSha256 = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $executableSha256 = (Get-FileHash -LiteralPath $cargoAuditExe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveSha256 -cne $env:CARGO_AUDIT_CRATE_SHA256) {
            throw "The cargo-audit archive changed during the locked installation."
          }
          $receipt = [ordered]@{
            schemaVersion = 1
            githubRunId = [string]$env:GITHUB_RUN_ID
            githubRunAttempt = [string]$env:GITHUB_RUN_ATTEMPT
            githubSha = [string]$env:GITHUB_SHA
            tool = "cargo-audit"
            requestedVersion = [string]$env:CARGO_AUDIT_VERSION
            reportedVersion = [string]$env:CARGO_AUDIT_VERSION
            reportedVersionOutput = $directReportedVersion.Trim()
            registryUri = $registryUri
            registryVersion = [string]$registryRecord.vers
            registryChecksum = [string]$registryRecord.cksum
            registryYanked = [bool]$registryRecord.yanked
            archiveDownloadUri = $archiveDownloadUri
            archivePath = [IO.Path]::GetFullPath($archivePath)
            archiveSha256 = $archiveSha256
            executablePath = [IO.Path]::GetFullPath($cargoAuditExe)
            executableSha256 = $executableSha256
            generatedAtUtc = [DateTime]::UtcNow.ToString("o")
          }
          $temporaryReceiptPath = "$receiptPath.tmp-$PID"
          [IO.File]::WriteAllText(
            $temporaryReceiptPath,
            ($receipt | ConvertTo-Json -Depth 4),
            [Text.UTF8Encoding]::new($false)
          )
          Move-Item -LiteralPath $temporaryReceiptPath -Destination $receiptPath
          "CARGO_AUDIT_EXE=$cargoAuditExe" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- cargo-audit same-run pin receipt: $receiptPath"

      - name: Verify the same-run cargo-audit pin receipt
        id: cargo_audit_pin_readiness
        shell: pwsh
        run: |
          $receiptPath = Join-Path $env:RUNNER_TEMP `
            "cargo-audit-pin-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/check-supply-chain.ps1 -Mode ReadinessOnly `
            -CargoAuditReceiptPath $receiptPath
          if ($LASTEXITCODE -ne 0) { throw "Supply-chain readiness remains incomplete; see the blocker list above" }

      - name: Set up the exact Node.js version for license inspection
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified 2026-08-27)
        with:
          node-version: "22.23.2"

      - name: Fetch locked Cargo dependency metadata
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo fetch --locked failed" }

      - name: Validate policy, exceptions, and Cargo/npm licenses
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/check-supply-chain.ps1 -Mode PolicyAndLicenses
          if ($LASTEXITCODE -ne 0) { throw "Supply-chain policy/license validation failed" }

      - name: Audit the Cargo lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $policy = Get-Content -LiteralPath ".github/security-policy.json" -Raw -Encoding UTF8 |
            ConvertFrom-Json
          $arguments = @("audit", "--file", "Cargo.lock")
          foreach ($exception in @($policy.advisoryExceptions | Where-Object { $_.ecosystem -eq "cargo" })) {
            $arguments += @("--ignore", [string]$exception.advisoryId)
          }
          if ([string]::IsNullOrWhiteSpace($env:CARGO_AUDIT_EXE) -or
              -not [IO.Path]::IsPathRooted($env:CARGO_AUDIT_EXE) -or
              -not (Test-Path -LiteralPath $env:CARGO_AUDIT_EXE -PathType Leaf)) {
            throw "The run-scoped cargo-audit executable is unavailable."
          }
          & $env:CARGO_AUDIT_EXE @arguments
          if ($LASTEXITCODE -ne 0) { throw "cargo audit found an advisory that is not covered by an active policy exception" }

  npm_advisories:
    name: npm production and complete lockfile advisories
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact event revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          $credentials = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $credentials" `
            -c protocol.version=2 fetch --no-tags --prune --depth=1 origin `
            "+$env:GITHUB_REF`:refs/remotes/origin/security-event"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          $actualRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualRevision -ne $env:GITHUB_SHA) {
            throw "Checked-out revision '$actualRevision' does not match GITHUB_SHA '$env:GITHUB_SHA'."
          }

      - name: Set up the exact Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (verified 2026-08-27)
        with:
          node-version: "22.23.2"

      - name: Audit production and complete npm lockfiles with exact tools
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $ErrorActionPreference = "Stop"
          $policy = Get-Content -LiteralPath "..\..\.github\security-policy.json" -Raw -Encoding UTF8 |
            ConvertFrom-Json
          $npmVersion = [string]$policy.toolPins.npmAudit.version
          $expectedNodeVersion = [string]$policy.toolPins.npmAudit.nodeVersion
          if ($npmVersion -notmatch "^\d+\.\d+\.\d+$") {
            throw "Exact npm version is unresolved in security-policy.json; npm audit did not run."
          }
          if ($expectedNodeVersion -notmatch "^22\.\d+\.\d+$" -or
              [string]$policy.toolPins.npmAudit.nodeVersionLine -ne $expectedNodeVersion) {
            throw "Exact Node version is unresolved or inconsistent in security-policy.json; npm audit did not run."
          }
          $nodeCommand = Get-Command node.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $nodeExe = [string]$nodeCommand.Source
          $reportedNodeVersion = & $nodeExe --version
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- npm audit runner Node evidence: $reportedNodeVersion"
          if ($LASTEXITCODE -ne 0 -or $reportedNodeVersion -ne "v$expectedNodeVersion") {
            throw "GitHub runner Node must be v$expectedNodeVersion; runner reported '$reportedNodeVersion'."
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- npm audit requested npm version: $npmVersion"
          $npmCommand = Get-Command npm.cmd -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $npmToolRoot = Join-Path $env:RUNNER_TEMP "npm-$npmVersion"
          & $npmCommand.Source install --prefix $npmToolRoot `
            --no-save --ignore-scripts --no-audit --no-fund "npm@$npmVersion"
          if ($LASTEXITCODE -ne 0) { throw "Pinned npm installation failed" }
          $npmCli = Join-Path $npmToolRoot "node_modules\npm\bin\npm-cli.js"
          $reportedNpmVersion = & $nodeExe $npmCli --version
          if ($LASTEXITCODE -ne 0 -or $reportedNpmVersion -ne $npmVersion) {
            throw "npm reported '$reportedNpmVersion', expected '$npmVersion'."
          }
          $npmExceptions = @($policy.advisoryExceptions | Where-Object { $_.ecosystem -eq "npm" })
          if ($npmExceptions.Count -ne 0) {
            throw "npm advisory exceptions are not silently applied; add exact result-to-exception matching before enabling one."
          }

          function Invoke-NpmAudit {
            param(
              [string]$Label,
              [string[]]$AdditionalArguments
            )
            $stderrPath = Join-Path $env:RUNNER_TEMP "npm-audit-$Label.stderr.txt"
            $arguments = @(
              $npmCli,
              "audit",
              "--package-lock-only",
              "--audit-level=high",
              "--json"
            ) + $AdditionalArguments
            $stdout = @(& $nodeExe @arguments 2> $stderrPath)
            $auditExitCode = $LASTEXITCODE
            $auditText = $stdout -join [Environment]::NewLine
            $auditPath = Join-Path $env:RUNNER_TEMP "npm-audit-$Label.json"
            [IO.File]::WriteAllText($auditPath, $auditText, [Text.UTF8Encoding]::new($false))
            try {
              $audit = $auditText | ConvertFrom-Json
            }
            catch {
              $stderrText = if (Test-Path -LiteralPath $stderrPath) {
                Get-Content -LiteralPath $stderrPath -Raw -Encoding UTF8
              } else { "" }
              throw "npm audit $Label did not return JSON (exit $auditExitCode): $stderrText"
            }
            $high = [int]$audit.metadata.vulnerabilities.high
            $critical = [int]$audit.metadata.vulnerabilities.critical
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY `
              -Value "- npm ${Label}: high=$high, critical=$critical, exit=$auditExitCode"
            if ($auditExitCode -gt 1) {
              throw "npm audit $Label failed operationally with exit code $auditExitCode"
            }
            return ($high + $critical)
          }

          $productionBlocking = Invoke-NpmAudit -Label "production" -AdditionalArguments @("--omit=dev")
          $completeBlocking = Invoke-NpmAudit -Label "complete" -AdditionalArguments @()
          if ($productionBlocking -gt 0 -or $completeBlocking -gt 0) {
            throw "npm audit found high/critical advisories: production=$productionBlocking, complete=$completeBlocking"
          }

  codeql_pin_evidence:
    name: Code analysis action reference evidence
    runs-on: windows-latest
    steps:
      - name: Check out the exact event revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          $credentials = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $credentials" `
            -c protocol.version=2 fetch --no-tags --prune --depth=1 origin `
            "+$env:GITHUB_REF`:refs/remotes/origin/security-event"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          $actualRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualRevision -ne $env:GITHUB_SHA) {
            throw "Checked-out revision '$actualRevision' does not match GITHUB_SHA '$env:GITHUB_SHA'."
          }

      - name: Confirm the reviewed v3 action reference
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $policy = Get-Content -LiteralPath ".github/security-policy.json" -Raw -Encoding UTF8 |
            ConvertFrom-Json
          $expectedSha = "6f5948dfacef28e207b48d0905cf90c03365536d"
          $toolPin = $policy.toolPins.codeql
          $analysis = $policy.staticAnalysis.javascriptTypescript
          if ($toolPin.commitSha -ne $expectedSha -or $analysis.commitSha -ne $expectedSha) {
            throw "security-policy.json does not contain the reviewed CodeQL v3 commit SHA."
          }
          if ($toolPin.commitShaVerified -ne $true -or $analysis.commitShaVerified -ne $true -or
              $toolPin.querySuite -ne "security-extended" -or $analysis.querySuite -ne "security-extended") {
            throw "CodeQL policy record is not verified security-extended configuration."
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Code analysis action v3 evidence: https://github.com/github/codeql-action/commit/$expectedSha"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- CodeQL query suite: security-extended"

  codeql_blocker:
    name: CodeQL security-extended analysis
    needs: codeql_pin_evidence
    if: ${{ always() }}
    runs-on: windows-latest
    steps:
      - name: Check out the exact event revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          git init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          $credentials = [Convert]::ToBase64String(
            [Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
          )
          git -c "http.extraheader=AUTHORIZATION: basic $credentials" `
            -c protocol.version=2 fetch --no-tags --prune --depth=1 origin `
            "+$env:GITHUB_REF`:refs/remotes/origin/security-event"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout --detach --force FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
          $actualRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actualRevision -ne $env:GITHUB_SHA) {
            throw "Checked-out revision '$actualRevision' does not match GITHUB_SHA '$env:GITHUB_SHA'."
          }

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3 (2026-08-26)
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Build CodeQL database
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3 (2026-08-26)

      - name: Analyze CodeQL database
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3 (2026-08-26)

  dependency_update_evidence:
    name: Dependency update proposal evidence
    runs-on: windows-latest
    steps:
      - name: Record current update proposals without merging them
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          # ConvertFrom-Json writes its parsed value as a single pipeline object, so wrapping
          # the pipe expression itself directly in @(...) would nest the real array inside a
          # 1-element array instead of flattening it (Count would always read 1 whenever gh
          # returned one or more proposals, and the loop below would iterate once over the
          # whole array instead of once per proposal). Bind the parsed value to a plain
          # variable first, then wrap that variable.
          $proposalsRaw = gh pr list --repo $env:GITHUB_REPOSITORY --state all --author app/dependabot --limit 100 --json number,title,url,createdAt,mergedAt,closedAt,headRefName,baseRefName,files | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read dependency update proposals from GitHub. No proposal was merged or approved."
          }
          $proposals = @($proposalsRaw)
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Dependency update proposals found: $($proposals.Count)"
          if ($proposals.Count -eq 0) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Cargo, JavaScript, and workflow updates: no current proposal."
          }
          foreach ($proposal in $proposals) {
            $paths = @($proposal.files | ForEach-Object { $_.path }) -join ", "
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- #$($proposal.number) $($proposal.title) — $paths — $($proposal.url)"
          }

  distribution_blocker:
    name: SBOM and release hash readiness
    runs-on: windows-latest
    steps:
      # release.yml が公開後に配布物を取得し直して照合すると(scripts/supply-chain-verify-release-hashes.ps1)、
      # 結果を ORIGAMI3_<version>_release-verification-result.json としてそのリリースへ追加で添付する。
      # ここでは、過去に公開したリリースをすべて調べ、この記録を持つものが1件でもあり、
      # かつ中身が「4件・名前重複なし・全件一致・sha256が正しい形」を満たすかを確認する。
      # 満たす記録が無ければ「未検証」と明記して通す(検証済みだと騙らない)。一覧取得そのものが
      # 失敗した場合は「未検証」に丸めず、このジョブを失敗させる(確認できないことを黙って見逃さない)。
      - name: Confirm whether a release has ever had its published artifacts verified
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:GITHUB_REPOSITORY
          $resultAssetPattern = '^ORIGAMI3_.+_release-verification-result\.json$'

          # ConvertFrom-Json writes its parsed value as a single pipeline object, so
          # @(gh ... | ConvertFrom-Json) directly would nest the real array inside a
          # 1-element array instead of flattening it. Bind first, then wrap.
          $releasesRaw = gh release list --repo $repo --limit 100 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "リリース一覧を取得できず、配布物の公開後照合の状態を確認できませんでした。これは「未検証」ではなく検査不能であるため、このジョブを失敗させます。"
          }
          $releases = @($releasesRaw)

          $verified = $false
          $verifiedEvidence = $null
          $checkedReleaseCount = 0
          $notes = New-Object System.Collections.Generic.List[string]

          foreach ($release in $releases) {
            if ([bool]$release.isDraft) { continue }
            $tag = [string]$release.tagName
            if ([string]::IsNullOrWhiteSpace($tag)) { continue }

            try {
              $assets = @((gh release view $tag --repo $repo --json assets | ConvertFrom-Json).assets)
              if ($LASTEXITCODE -ne 0) { throw "gh release view exited with $LASTEXITCODE" }
            }
            catch {
              $notes.Add("release ${tag}: could not list assets ($($_.Exception.Message))")
              continue
            }
            $checkedReleaseCount++

            $resultAsset = @($assets | Where-Object { [string]$_.name -match $resultAssetPattern }) | Select-Object -First 1
            if ($null -eq $resultAsset) {
              $notes.Add("release ${tag}: no verification-result asset published")
              continue
            }

            try {
              $downloadDir = Join-Path $env:RUNNER_TEMP ("dist-verify-{0}" -f ([guid]::NewGuid().ToString("N")))
              New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null
              gh release download $tag --repo $repo --dir $downloadDir --pattern $resultAsset.name --clobber
              if ($LASTEXITCODE -ne 0) { throw "gh release download exited with $LASTEXITCODE" }
              $resultPath = Join-Path $downloadDir $resultAsset.name
              # Same @()-around-a-pipe pitfall as above: bind first, then wrap.
              $entriesRaw = Get-Content -LiteralPath $resultPath -Raw -Encoding UTF8 | ConvertFrom-Json
              $entries = @($entriesRaw)
            }
            catch {
              $notes.Add("release ${tag}: could not read $($resultAsset.name) ($($_.Exception.Message))")
              continue
            }

            $names = @($entries | ForEach-Object { [string]$_.artifactName })
            # -notmatch is case-insensitive by default in PowerShell, so it would accept an
            # uppercase-hex sha256 as "shaped like" one. The real script only ever emits
            # lowercase hex (ToLowerInvariant()), so -cnotmatch (case-sensitive) is used here
            # to keep this check as strict as what a genuine result can actually contain.
            $isValid = (
              $entries.Count -eq 4 -and
              (@($names | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -eq 0) -and
              (@($names | Select-Object -Unique).Count -eq 4) -and
              (@($entries | Where-Object { [string]$_.result -ne "match" }).Count -eq 0) -and
              (@($entries | Where-Object { [string]$_.sha256 -cnotmatch '^[0-9a-f]{64}$' }).Count -eq 0)
            )
            if ($isValid) {
              $verified = $true
              $verifiedEvidence = "release $tag, asset $($resultAsset.name)"
              break
            }
            $notes.Add("release ${tag}: $($resultAsset.name) did not show four matching artifacts")
          }

          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## 配布物の公開後照合の状態"
          if ($verified) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- 状態: 検証済み"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- 根拠: $verifiedEvidence (公開済み配布物を取得し直し、4件すべての一致を確認した記録)"
            Write-Host "distribution readiness: verified ($verifiedEvidence)"
          }
          else {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- 状態: 未検証"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- 確認したリリース数: $checkedReleaseCount"
            foreach ($note in $notes) {
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "  - $note"
            }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- この関門は「検証済み」を主張していません。タグ付きリリースを1回発行し、release.yml の公開後照合(scripts/supply-chain-verify-release-hashes.ps1)が成功すれば、この関門は次回実行から自動的に「検証済み」へ切り替わります。"
            Write-Host "distribution readiness: unverified (no release has a valid, matching verification-result asset yet)"
          }

  security_status:
    name: Security status and failure notification surface
    if: ${{ always() }}
    needs:
      - cargo_and_licenses
      - npm_advisories
      - codeql_pin_evidence
      - codeql_blocker
      - dependency_update_evidence
      - distribution_blocker
    runs-on: windows-latest
    steps:
      - name: Summarize all security jobs
        shell: pwsh
        env:
          CARGO_AND_LICENSES: ${{ needs.cargo_and_licenses.result }}
          NPM_ADVISORIES: ${{ needs.npm_advisories.result }}
          CODEQL_PIN_EVIDENCE: ${{ needs.codeql_pin_evidence.result }}
          CODEQL: ${{ needs.codeql_blocker.result }}
          DEPENDENCY_UPDATE_EVIDENCE: ${{ needs.dependency_update_evidence.result }}
          DISTRIBUTION: ${{ needs.distribution_blocker.result }}
        run: |
          $results = [ordered]@{
            cargo_and_licenses = $env:CARGO_AND_LICENSES
            npm_advisories = $env:NPM_ADVISORIES
            codeql_pin_evidence = $env:CODEQL_PIN_EVIDENCE
            codeql = $env:CODEQL
            dependency_update_evidence = $env:DEPENDENCY_UPDATE_EVIDENCE
            distribution = $env:DISTRIBUTION
          }
          foreach ($entry in $results.GetEnumerator()) {
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- $($entry.Key): $($entry.Value)"
          }
          $notSuccessful = @($results.GetEnumerator() | Where-Object { $_.Value -ne "success" })
          if ($notSuccessful.Count -ne 0) {
            throw "One or more security jobs did not succeed. GitHub Actions records this failed check and sends the repository's configured workflow-failure notifications."
          }
