name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # 18:17 UTC = 翌日03:17 JST。時刻の重なりを避けて毎日実行する。
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests, lint, and desktop checks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # 180度の重なり順を全数で掃引する2件だけは、最適化ありの performance ジョブで
      # 走らせる。最適化なしでは手元で 476秒 / 175秒 かかり、CIの計算機は手元より
      # 約3.6倍遅いので、この2件だけでこのジョブが約39分延びる。最適化ありでは
      # 合わせて手元で1分未満(CI換算 約3.4分)で済む。どちらの検査も消さない。
      #
      # 提案の探索の3件も、最適化ありの performance ジョブで走らせる。花弁折り・
      # つぶし折りの候補を既定で作るようにした(crates/ori3-propose/src/enumerate.rs の
      # WITH_EXTRA_CANDIDATES)ため、最適化なしでは手元で
      # 約7.5時間 / 374秒 / 375秒 かかる(変更前は 587秒 / 30秒 / 6秒)。
      # 最適化ありでは 1,332秒 / 12秒 / 11秒(CI換算 合わせて約81分)で済む。
      # 影響を受けるのはこの3件だけで、ほかの探索の検査は search_to_finish を使い、
      # 追加の候補を1件も作らない(crates/ori3-propose/src/search.rs の
      # `if completion.is_some()` が、追加の候補を作る場所を囲っている)。
      # どの検査も消さない。
      # proposal_matrix_contract のdebug・1候補・1要求・直列・空き・1回smokeは、
      # このworkspace testに既に含まれる。重複するstepは足さず、checksの時間を延ばさない。
      #
      # the_heaviest_proposal_never_hits_the_time_limit も、最適化ありの performance
      # ジョブで走らせる。この検査は「watchdogの打ち切りに当たらないこと」を主張する。
      # watchdogは壁時計なので、最適化なしでは16.8〜20.5倍遅くなり必ず当たる
      # (実測: 最適化なしで先端12本の4候補すべてが`WatchdogExpired`。最適化ありでは
      # 0件/10回・最大13.851秒)。最適化ありでのみ成り立つ主張なので、
      # performanceジョブで最適化ありで走らせる。検査は消していない。
      - name: Run Rust tests
        run: cargo test --workspace -- --skip surface_order_179_999_to_180_all_110_creases --skip surface_order_exact_endpoint_is_rank_stable_for_previous_19 --skip completion_search_uses_safe_subsets_and_is_deterministic_ten_out_of_ten --skip named_sample_completes_end_to_end_and_is_deterministic_ten_out_of_ten --skip a_safe_coincident_partial_network_appears_after_the_first_fold --skip the_heaviest_proposal_never_hits_the_time_limit

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Lint desktop frontend
        working-directory: apps/desktop
        run: npm run lint

      - name: Test desktop frontend
        working-directory: apps/desktop
        run: npm run test

      # production専用のsymmetry性能検査も、Node.jsと依存部品を既に用意したこのjobで
      # 完全に同じ別processとして走らせる。長いperformance jobでNode setupとnpm ciを
      # 重ねず、検査数・production mode・worker数は変えない。
      - name: Test symmetry performance in production mode
        working-directory: apps/desktop
        run: npm run test -- --maxWorkers=1 --mode=production src/lib/symmetry.test.ts

  performance:
    name: Release performance tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test soft-body performance in release mode
        run: cargo test --release -p ori3-soft --test perf_soft -- --nocapture

      - name: Test rigid-folding performance in release mode
        run: cargo test --release -p ori3-rigid --test perf_miura -- --nocapture

      - name: Test fold-motion performance in release mode
        run: cargo test --release -p ori3-rigid --test perf_yakko --test perf_contact -- --nocapture

      - name: Test curve crease performance in release mode
        run: cargo test --release -p ori3-cp --test curve -- --nocapture

      - name: Test replay performance in release mode
        run: cargo test --release -p ori3-layers --test replay -- --nocapture

      - name: Test packing performance in release mode
        run: cargo test --release -p ori3-propose --test perf_packing -- --ignored --nocapture

      - name: Test the 180-degree surface order sweep in release mode
        run: cargo test --release -p desktop --lib surface_order_179_999_to_180_all_110_creases -- --nocapture

      - name: Test the exact endpoint surface order in release mode
        run: cargo test --release -p desktop --lib surface_order_exact_endpoint_is_rank_stable_for_previous_19 -- --nocapture

      - name: Test crane soft-body performance in release mode
        run: cargo test --release -p ori3-soft --test soft_crane -- --nocapture

      - name: Test packing throughput performance in release mode
        run: cargo test --release -p ori3-propose --test perf_packing -- --nocapture

      - name: Test the completion search determinism in release mode
        run: cargo test --release -p ori3-propose --test acceptance -- completion_search_uses_safe_subsets_and_is_deterministic_ten_out_of_ten --exact --nocapture

      - name: Test the end-to-end named sample in release mode
        run: cargo test --release -p ori3-propose --test end_to_end -- named_sample_completes_end_to_end_and_is_deterministic_ten_out_of_ten --exact --nocapture

      - name: Test the safe partial network candidates in release mode
        run: cargo test --release -p ori3-propose --test acceptance -- a_safe_coincident_partial_network_appears_after_the_first_fold --exact --nocapture

      - name: Test the heaviest proposal never hits the time limit in release mode
        run: cargo test --release -p desktop --lib the_heaviest_proposal_never_hits_the_time_limit -- --nocapture

      # 解決済み3検査×100回だけで約37時間39分かかり、さらに32 cell×100回を
      # 加えるFullはGitHub Actionsの1ジョブ6時間上限を超える。ここではprofile両端のうち、
      # release・4候補・2要求・並列・混雑を1回と製品hashだけ確認する。
      # Fullはほかの作業を止めたリリース直前に手元で1回だけ実行する。
      - name: Test the proposal matrix release boundary
        run: powershell -NoProfile -ExecutionPolicy Bypass -File crates/ori3-propose/tests/run-proposal-matrix.ps1 -Mode Performance

  current_status:
    name: Nightly and pre-release document drift check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: never

    steps:
      - name: Set the build directory
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP\ori3-target-docs7b" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify implementation-derived document status
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-current-status.ps1 -Check
