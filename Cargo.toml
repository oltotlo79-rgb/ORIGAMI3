[workspace]
resolver = "2"
members = [
    "crates/ori3-model",
    "crates/ori3-geometry",
    "crates/ori3-cp",
    "crates/ori3-rigid",
    "crates/ori3-layers",
    "crates/ori3-soft",
    "crates/ori3-propose",
    "crates/ori3-export",
    "crates/ori3-app-core",
    "crates/ori3-web",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
glam = "0.33.3"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.19"

ori3-model = { path = "crates/ori3-model" }
ori3-geometry = { path = "crates/ori3-geometry" }
ori3-cp = { path = "crates/ori3-cp" }
ori3-rigid = { path = "crates/ori3-rigid" }
ori3-layers = { path = "crates/ori3-layers" }
ori3-soft = { path = "crates/ori3-soft" }
ori3-propose = { path = "crates/ori3-propose" }
ori3-export = { path = "crates/ori3-export" }
ori3-app-core = { path = "crates/ori3-app-core" }
