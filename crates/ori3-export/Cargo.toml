[package]
name = "ori3-export"
version.workspace = true
edition.workspace = true

[dependencies]
ori3-model.workspace = true
ori3-cp.workspace = true
ori3-geometry.workspace = true
ori3-layers.workspace = true
ori3-rigid.workspace = true
glam.workspace = true
# SVGのラスタライズ(PNG書き出し)。文字は使わないのでtext機能は外す
resvg = { version = "0.48.1", default-features = false }
# 折り図のPDF化。文字を出すのでtextは入れるが、画像や特殊効果は使わない
svg2pdf = { version = "0.13.0", default-features = false, features = ["text"] }
# 複数ページのPDFを組み立てる(svg2pdfが使うのと同じ版)
pdf-writer = "0.12.1"
